<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and search university study materials, lecture notes, exam papers, and study summaries by course and institution." />
    <title>Browse Study Materials, Notes &amp; Exam Papers | QMarketplace</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <a href="/" class="brand"><span class="brand-mark">Q</span><span>QMarketplace</span></a>
          <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/materials.html">Materials</a>
            <a href="/universities.html">Universities</a>
            <a href="/about.html">About</a>
          </nav>
          <a class="btn btn-primary" data-auth-link href="/login.html">Login</a>
        </div>
      </header>

      <main class="section">
        <div class="container">
          <div class="section-head">
            <div>
              <div class="badge">Browse the catalog</div>
              <h1>Study materials</h1>
              <p>Search by course, institution, title, or subject.</p>
            </div>
          </div>
          <div class="filter-bar">
            <div class="search-box">
              <label class="visually-hidden" for="material-search">Search materials</label>
              <input id="material-search" type="search" data-search-input placeholder="Search notes, courses, and universities" />
            </div>
            <select class="select" data-type-filter aria-label="Filter by material type">
              <option value="">All material types</option>
              <option value="lecture notes">Lecture notes</option>
              <option value="exam papers">Exam papers</option>
              <option value="study summaries">Study summaries</option>
            </select>
            <select class="select" data-university-filter aria-label="Filter by university">
              <option value="">All universities</option>
            </select>
            <select class="select" data-sort aria-label="Sort materials">
              <option value="recent">Recently added</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="title">Title: A to Z</option>
            </select>
          </div>
          <p class="catalog-count" data-result-count aria-live="polite"></p>
          <div class="grid grid-3 material-grid" data-material-list></div>
          <nav class="pagination" data-pagination aria-label="Catalog pages"></nav>
        </div>
      </main>
    </div>
    <script src="./js/api.js"></script>
    <script src="./js/seo.js"></script>
    <script src="./js/navigation.js"></script>
    <script src="./js/materials.js"></script>
    <script src="./js/pdf-previews.js"></script>
  </body>
</html>
