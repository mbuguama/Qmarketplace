<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Register | QMarketplace</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-banner">
          <a href="/" class="auth-home">QMarketplace</a>
          <div class="badge">Create account</div>
          <h1>Join QMarketplace</h1>
        </div>
        <form data-auth-form data-auth-mode="register" class="form-grid">
          <p class="form-message" data-form-message role="alert" aria-live="polite"></p>
          <div class="form-row">
            <div class="field">
              <label for="firstName">First name</label>
              <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="80" required />
            </div>
            <div class="field">
              <label for="lastName">Last name</label>
              <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="80" required />
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </div>
          <button type="submit" class="btn btn-primary">Create account</button>
          <p class="small">Already a member? <a href="/login.html" class="link-inline">Sign in</a></p>
        </form>
      </div>
    </div>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
