<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Profile | QMarketplace</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/profile.css" />
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
</head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <a href="/" class="brand"><span class="brand-mark">Q</span><span>QMarketplace</span></a>
          <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/materials.html">Materials</a>
            <a href="/universities.html">Universities</a>
            <a href="/about.html">About</a>
          </nav>
          <a class="btn btn-primary" href="/logout.html" data-logout>Logout</a>
        </div>
      </header>
      <main class="section">
        <div class="container profile-layout">
          <aside class="profile-sidebar">
            <div class="account-card" data-profile></div>
            <div class="summary-box">
              <span class="badge">Student account</span>
              <strong>Your library</strong>
              <p>Review orders and access materials after payment is confirmed.</p>
              <a class="text-link" href="/my-materials.html">Open my materials</a>
            </div>
          </aside>
          <section class="account-card">
            <div class="section-head">
              <div>
                <div class="badge">Orders</div>
                <h2>Recent purchases</h2>
              </div>
            </div>
            <div data-orders></div>
          </section>
        </div>
      </main>
    </div>
    <script src="./js/api.js"></script>
    <script src="./js/navigation.js"></script>
    <script src="./js/downloads.js"></script>
    <script src="./js/profile.js"></script>
  </body>
</html>
