<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Contact | QMarketplace</title><link rel="stylesheet" href="./css/global.css" /><link rel="stylesheet" href="./css/layout.css" /><link rel="stylesheet" href="./css/components.css" /> <link rel="icon" type="image/png" href="./assets/images/favicon.png">
</head>
  <body><div class="page-shell">
    <header class="topbar"><div class="container topbar-inner"><a href="/" class="brand"><span class="brand-mark">Q</span><span>QMarketplace</span></a><nav class="nav-links" aria-label="Main navigation"><a href="/">Home</a><a href="/materials.html">Materials</a><a href="/faq.html">FAQ</a><a href="/contact.html">Contact</a></nav><div class="topbar-actions"><a class="btn btn-primary" data-auth-link href="/login.html">Login</a></div></div></header>
    <main class="section"><article class="container prose">
      <span class="badge">Contact</span><h1>Get in touch</h1>
      <p>Send a message to the marketplace team. Your message is stored for an administrator to review; this form does not send email.</p>
      <form class="admin-form" data-contact-form>
        <label class="field">Your name<input class="input" name="name" maxlength="120" autocomplete="name" required /></label>
        <label class="field">Email<input class="input" name="email" type="email" maxlength="254" autocomplete="email" required /></label>
        <label class="field">Subject<input class="input" name="subject" maxlength="160" required /></label>
        <label class="field">Message<textarea class="input" name="message" maxlength="5000" rows="7" required></textarea></label>
        <p class="form-message" data-contact-message role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
      <a class="btn btn-secondary" href="/faq.html">Read frequently asked questions</a>
    </article></main>
    <footer class="footer"><div class="container"><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></div></footer>
  </div><script src="./js/api.js"></script><script src="./js/navigation.js"></script><script src="./js/contact.js"></script></body>
</html>
