<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Login | QMarketplace</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
</head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-banner">
          <a href="/" class="auth-home">QMarketplace</a>
          <div class="badge">Member sign in</div>
          <h1>Welcome back</h1>
        </div>
        <form data-auth-form data-auth-mode="login" class="form-grid">
          <p class="form-message" data-form-message role="alert" aria-live="polite"></p>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.edu" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </div>
          <label class="checkbox-row"><input type="checkbox" name="remember" value="yes" /> Keep me signed in on this device</label>
          <button type="submit" class="btn btn-primary">Sign in</button>
          <p class="small">Need an account? <a href="/register.html" class="link-inline">Create one</a></p>
        </form>
      </div>
    </div>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
